# Mirrors the formatting the project had with Biome.
[fmt]
useTabs = true
tabWidth = 2
printWidth = 80
semi = true
singleQuote = false
jsxSingleQuote = false
quoteProps = "as-needed"
trailingComma = "all"
bracketSpacing = true
arrowParens = "always"
endOfLine = "lf"

[install]
# Refuse package versions published less than 3 days ago: most malicious
# releases are caught and pulled within that window.
minimumReleaseAge = "3d"
